services:
  db:
    image: postgres:17
    container_name: pizzaria_db
    environment:
      POSTGRES_DB: pizzaria
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5555:5432"
    volumes:
      - pizzaria-data:/var/lib/postgresql/data

volumes:
  pizzaria-data:



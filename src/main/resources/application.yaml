spring:
  application:
    name: pizzaria

  datasource:
    url: jdbc:postgresql://localhost:5555/pizzaria
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  server:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

cloudinary:
  url: ${CLOUDINARY_URL}
